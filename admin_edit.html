{% extends "base.html" %}

{% block content %}
<section class="section-block">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Panel administrador</p>
            <h1 class="h3">Editar actividad</h1>
        </div>
        <a class="btn btn-outline-dark btn-sm" href="{{ url_for('admin.admin_panel') }}">Volver</a>
    </div>

    <div class="panel">
        <form method="post" action="{{ url_for('admin.edit_activity', activity_id=activity.id) }}" class="row g-3" enctype="multipart/form-data">
            <div class="col-md-6">
                <label class="form-label" for="name">Nombre</label>
                <input class="form-control" id="name" name="name" type="text" value="{{ activity.name }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="category">Categoria</label>
                <select class="form-select" id="category" name="category" required>
                    {% for category in categories %}
                        <option value="{{ category }}" {% if activity.category == category %}selected{% endif %}>{{ category }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="mood">Mood</label>
                <select class="form-select" id="mood" name="mood" required>
                    {% for mood in moods %}
                        <option value="{{ mood }}" {% if activity.mood == mood %}selected{% endif %}>{{ mood }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="minutes">Tiempo estimado</label>
                <input class="form-control" id="minutes" name="minutes" type="number" min="5" value="{{ activity.minutes }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="cost">Costo aproximado (COP)</label>
                <input class="form-control" id="cost" name="cost" type="number" min="0" step="100" value="{{ "%.0f"|format(activity.cost) }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="tags">Etiquetas</label>
                <input class="form-control" id="tags" name="tags" type="text" value="{{ activity.tags }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="image">Cambiar imagen</label>
                <input class="form-control" id="image" name="image" type="file" accept="image/*">
            </div>
            <div class="col-md-6">
                {% if activity.image_filename %}
                    <img class="edit-preview" src="{{ url_for('static', filename='uploads/' ~ activity.image_filename) }}" alt="Imagen actual de {{ activity.name }}">
                {% else %}
                    <div class="edit-preview empty-preview">Sin imagen cargada</div>
                {% endif %}
            </div>
            <div class="col-12">
                <label class="form-label" for="description">Descripcion</label>
                <textarea class="form-control" id="description" name="description" rows="4">{{ activity.description or "" }}</textarea>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Guardar cambios</button>
                <a class="btn btn-outline-dark" href="{{ url_for('admin.admin_panel') }}">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}

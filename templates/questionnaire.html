{% extends "base.html" %}

{% block content %}
<section class="narrow-page">
    <div class="panel">
        <p class="eyebrow">Recomendador</p>
        <h1 class="h3">Cuestionario rapido</h1>
        <p class="text-muted">Usaremos tus respuestas para filtrar actividades compatibles.</p>
        <form method="post" action="{{ url_for('main.questionnaire') }}" class="mt-4">
            <div class="mb-3">
                <label class="form-label" for="minutes">Tiempo disponible en minutos</label>
                <input class="form-control" id="minutes" name="minutes" type="number" min="5" max="1440" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="mood">Estado de animo</label>
                <select class="form-select" id="mood" name="mood" required>
                    {% for mood in moods %}
                        <option value="{{ mood }}">{{ mood }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label" for="budget">Presupuesto (COP)</label>
                <input class="form-control" id="budget" name="budget" type="number" min="0" step="100" placeholder="30000" required>
            </div>
            <button class="btn btn-primary" type="submit">Ver recomendaciones</button>
        </form>
    </div>
</section>
{% endblock %}

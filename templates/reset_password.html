{% extends "base.html" %}

{% block content %}
<section class="narrow-page">
    <div class="panel">
        <p class="eyebrow">Nueva contrasena</p>
        <h1 class="h3">Restablecer acceso</h1>
        <form method="post" class="mt-4">
            <div class="mb-3">
                <label class="form-label" for="password">Nueva contrasena</label>
                <input class="form-control" id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="confirm_password">Confirmar contrasena</label>
                <input class="form-control" id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary" type="submit">Actualizar contrasena</button>
        </form>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<section class="auth-layout">
    <div class="auth-copy">
        <p class="eyebrow">Crear cuenta</p>
        <h1>Tu espacio para descubrir planes y guardar ideas.</h1>
        <p class="text-muted">El email se normaliza automaticamente y la contrasena se guarda hasheada con Werkzeug.</p>
    </div>
    <div class="panel auth-panel">
        <h2 class="h4 mb-3">Registro</h2>
        <form method="post" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label class="form-label" for="name">Nombre</label>
                <input class="form-control" id="name" type="text" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" name="email" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contrasena</label>
                <input class="form-control" id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="confirm_password">Confirmar contrasena</label>
                <input class="form-control" id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
        </form>
        <hr>
        <p class="mb-0 small">Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesion</a>.</p>
    </div>
</section>
{% endblock %}

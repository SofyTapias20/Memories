{% extends "base.html" %}

{% block content %}
<section class="narrow-page">
    <div class="panel">
        <p class="eyebrow">Recuperacion</p>
        <h1 class="h3">Olvid&eacute; mi contrasena</h1>
        <p class="text-muted">Escribe tu email y generaremos un enlace temporal con itsdangerous.</p>
        <form method="post" action="{{ url_for('auth.forgot_password') }}" class="mt-4">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" name="email" autocomplete="email" required>
            </div>
            <button class="btn btn-primary" type="submit">Generar enlace</button>
            <a class="btn btn-link" href="{{ url_for('auth.login') }}">Volver</a>
        </form>
        {% if reset_link %}
            <div class="dev-reset-link mt-4">
                <span class="small text-muted d-block mb-2">Modo desarrollo</span>
                <a href="{{ reset_link }}">{{ reset_link }}</a>
            </div>
        {% endif %}
    </div>
</section>
{% endblock %}
